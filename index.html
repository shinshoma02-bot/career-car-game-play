<style>
  /* 確認用の欄(当たり判定・レイヤー切り替え・読み込み表示)は、URLに debug を付けた時だけ出す(下の D8 の部分で非表示にしている) */
/* スマホ操作: 長押しの選択・コピー・画像メニュー・ダブルタップ拡大・タップ時の青い枠を出さない */
  html, body, button, img, canvas, div, span { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
  img, canvas { -webkit-user-drag: none; }  html, body {

    padding: 0;
    background: #222;
    color: #eee;
    font-family: sans-serif;
    overflow-x: hidden;
  }
  #toolbar {

  }

  }

  .previewLabel {
    font-size: 12px;

  /* 車を動かす矢印は、スクロールしても常に画面の右下に出す(フロア操作のボタンを触りながら車を動かせるように) */

  #btnDispatch { font-size: 13px; padding: 5px 10px; background: #3a2f1c; color: #ffe0a0; border: 1px solid #a8863c; border-radius: 6px; cursor: pointer; }
  #btnDispatch:disabled, #btnDispatch.na { opacity: .4; cursor: default; }
  #dispatchAsk, #dispatchSay { z-index: 110; }

  .dispatchSpeech { font-size: 18px; line-height: 1.6; color: #fff; background: #26303b; border: 1px solid #456; border-radius: 10px; padding: 14px 12px; margin-bottom: 10px; }

  #resultScore { font-size: 26px; font-weight: bold; color: #ffe680; margin: 12px 0; }
  .modeBtn {
    display: block;

    margin-top: 10px;

    background: #2a3340;
    color: #fff;
    border: 1px solid #567;

  }
  .modeBtn small { display: block; font-size: 12px; font-weight: normal; color: #c6cad8; margin-top: 4px; }
  .modeBtn:active { background: #4a6a4a; }

  #btnOrientCar { display: block; width: 100%; margin-top: 4px; padding: 6px 4px; font-size: 12px; background: #2d4a2d; color: #fff; border: 1px solid #585; border-radius: 5px; cursor: pointer; }

  #deckAll { display: flex; flex-wrap: wrap; gap: 8px; max-width: 100%; }

  .deckItem canvas:hover { border-color: #8f8; }
  .deckItem.road canvas, .deckItem.loaded canvas { opacity: .35; cursor: default; border-color: #444; }
  .deckItem .deckTag { font-size: 12px; color: #d4f2d4; min-height: 16px; }
  .deckItem button { width: 100%; padding: 7px 2px; font-size: 12px; background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
  .deckItem.loaded button { visibility: hidden; }

  #deckHard { display: none; }
  #floorPanel #btnSwClose { margin-left: 8px; padding: 2px 8px; font-size: 11px; background: #2a2a2a; color: #9cf; border: 1px solid #456; border-radius: 4px; cursor: pointer; }
  #swHint { font-size: 12px; color: #c6cad8; line-height: 1.7; padding: 4px 0 8px; }
  .swCards { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }

  .swCard.tire { text-align: left; }

  .swCard .pinRow { margin-top: 6px; }
  .swCard .pinRow button { background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 5px; font-size: 13px; padding: 11px 0; cursor: pointer; }
  .swCard .pinRow button.on { background: #2d6a2d; border-color: #4a4; }
  #slotSel { flex: 1 1 100%; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: #c6cad8; }
  #slotSel button { min-width: 42px; padding: 10px 8px; }
  #slotSel button.on { background: #2d6a2d; border-color: #4a4; }
  #deckHard.selLocked #carPreview { opacity: .4; cursor: not-allowed; }
  #hardRow { display: flex; align-items: center; gap: 6px; }
  .carNav { width: 40px; height: 64px; font-size: 20px; background: #2a2a2a; color: #fff; border: 1px solid #666; border-radius: 6px; cursor: pointer; }
  .carNav:disabled { opacity: .3; cursor: default; }
  #diffNote { font-size: 12px; color: #aab; margin-top: 8px; }  #btnShowAll { margin-left: 8px; padding: 2px 8px; font-size: 11px; background: #2a2a2a; color: #9cf; border: 1px solid #456; border-radius: 4px; cursor: pointer; }
  #btnShowAll.on { background: #2d4a6a; color: #fff; }  #chockPanel {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 12px;
    background: #1a1a1a;
    border-top: 2px solid #333;

    color: #ffd080;
  }

  #chockPanel button {
    background: #2a2a2a;
    color: #fff;
    border: 1px solid #555;

    padding: 8px 12px;

    cursor: pointer;
  }
  #chockPanel button:disabled { opacity: .35; cursor: default; }
  #floorPanel {
    background: #161616;
    padding: 10px 12px 14px;
    border-top: 2px solid #333;
  }
  #floorPanel h3 {
    margin: 0 0 8px;
    font-size: 13px;
    color: #9cf;
  }
  .endCols {
    display: flex;
    gap: 8px;
    overflow-x: auto;
  }
  .endCol {
    background: #222;
    border-radius: 6px;
    padding: 6px;
    min-width: 76px;
    text-align: center;
    flex: none;
  }
  .endCol .endLabel { font-size: 11px; color: #ccc; margin-bottom: 4px; }
  .endCol button {
    width: 100%;
    margin-top: 4px;
    background: #2a2a2a;
    color: #fff;
    border: 1px solid #555;
    border-radius: 5px;
    font-size: 13px;
    padding: 5px 0;
    cursor: pointer;
  }
  .endCol button:active { background: #4a4; }
  .pinRow { display: flex; gap: 2px; margin-top: 4px; }
  .pinRow button { flex: 1; font-size: 11px; padding: 4px 0; margin-top: 0; }
  .mechRow {
    display: flex;
    gap: 8px;

  }
  .mechRow button {
    background: #2a2a2a;
    color: #fff;
    border: 1px solid #555;
    border-radius: 5px;

    padding: 7px 10px;
    cursor: pointer;
  }
  .mechRow button.on { background: #2d6a2d; border-color: #4a4; }
  #floorStatus {
    margin-top: 8px;
    font-size: 12px;
    color: #9c9;
    min-height: 1.4em;
  }

  /* ===== D8: 画面を見やすくする(ボタンの素材 assets/common/ui/ を使う。9分割は border-image) ===== */
  :root { --ui: url(assets/common/ui/); }
  /* 操作ボタン(板): 普通=銀、押すと沈む、今やるべき操作(.go)=緑、注意(.warn)=橙、押せない=灰 */
  .plate, #floorPanel .mechRow button, #chockPanel button, #btnOrient, #btnOrientCar, #deckDrawerHandle {
    box-sizing: border-box;
    min-height: 46px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 0 10px 0 6px;
    color: #1b1f24; font-size: 13px; font-weight: bold; line-height: 1.2; text-align: center;
    background: none;
    border: 14px solid transparent; border-width: 14px; margin: 0;
    border-image: url(assets/common/ui/btn_plate.png?v=212) 14 fill / 14px stretch;
    border-radius: 0;
    text-shadow: 0 1px 0 rgba(255,255,255,.35);
  }
  .plate:active, #floorPanel .mechRow button:active, #chockPanel button:active, #btnOrient:active, #btnOrientCar:active, #deckDrawerHandle:active { border-image-source: url(assets/common/ui/btn_plate_pressed.png?v=212); padding-top: 2px; }
  #floorPanel .mechRow button.on, #chockPanel button.on, #btnOrientCar { border-image-source: url(assets/common/ui/btn_plate_go.png?v=212); }
  #floorPanel .mechRow button.on:active, #btnOrientCar:active { border-image-source: url(assets/common/ui/btn_plate_go_pressed.png?v=212); }
  #btnStopper:not(.on), #btnLid { border-image-source: url(assets/common/ui/btn_plate_warn.png?v=212); }
  #btnStopper:not(.on):active, #btnLid:active { border-image-source: url(assets/common/ui/btn_plate_warn_pressed.png?v=212); }
  #floorPanel .mechRow button.go { border-image-source: url(assets/common/ui/btn_plate_go.png?v=212); }
  #floorPanel .mechRow button.go:active { border-image-source: url(assets/common/ui/btn_plate_go_pressed.png?v=212); }
  #chockPanel button:disabled, #btnOrient:disabled { border-image-source: url(assets/common/ui/btn_plate_disabled.png?v=212); opacity: 1; color: #6b7078; text-shadow: none; }
  #floorPanel .mechRow button::before, #chockPanel #btnLid::before, #chockPanel #btnChockSet::before, #chockPanel #btnChockFront::before, #chockPanel #btnChockRear::before, #btnOrient::before, #btnOrientCar::before, #deckDrawerHandle::before {
    content: ''; flex: none; width: 26px; height: 26px; background-position: center; background-size: contain; background-repeat: no-repeat;
  }
  #modeBar > span:empty { display: none; }
  #btnStopper::before { background-image: url(assets/common/ui/ic_stopper.png?v=212); }
  #btnRamp::before { background-image: url(assets/common/ui/ic_ramp.png?v=212); }
  #btnBridge::before { background-image: url(assets/common/ui/ic_bridge.png?v=212); }
  #btnF2Flap::before { background-image: url(assets/common/ui/ic_flap2.png?v=212); }
  #btnLid::before { background-image: url(assets/common/ui/ic_lid.png?v=212); }
  #btnChockSet::before { background-image: url(assets/common/ui/ic_chock.png?v=212); }
  #btnChockFront::before { background-image: url(assets/common/ui/ic_front.png?v=212); }
  #btnChockRear::before { background-image: url(assets/common/ui/ic_rear.png?v=212); }
  #btnOrient::before, #btnOrientCar::before { background-image: url(assets/common/ui/ic_orient.png?v=212); }
  #deckDrawerHandle::before { background-image: url(assets/common/ui/ic_drawer.png?v=212); }
  #chockPanel #btnChockFront, #chockPanel #btnChockRear { font-size: 0; padding: 0 4px; min-width: 56px; }   /* ◀前へ・後ろへ▶ は、アイコンだけ */
  #chockPanel #btnChockFront::after { content: '前へ'; font-size: 12px; }
  #chockPanel #btnChockRear::after { content: '後ろへ'; font-size: 12px; }
  #btnOrient, #btnOrientCar { width: 100%; margin-top: 6px; }

  /* 輪止め・落し蓋のスロット: 棚の名札(slot_*)。選んでいる番号は黄色い縁 */
  #slotSel button { box-sizing: border-box; width: 46px; height: 46px; min-width: 0; padding: 0; border: 0; border-radius: 0; font-size: 0; color: transparent; background: center / contain no-repeat; }
  #slotSel button.on { background-color: transparent; border: 0; }
  #slotSel button[data-slot="1"] { background-image: url(assets/common/ui/slot_1.png?v=212); } #slotSel button[data-slot="1"].on { background-image: url(assets/common/ui/slot_1_selected.png?v=212); }
  #slotSel button[data-slot="2"] { background-image: url(assets/common/ui/slot_2.png?v=212); } #slotSel button[data-slot="2"].on { background-image: url(assets/common/ui/slot_2_selected.png?v=212); }
  #slotSel button[data-slot="3"] { background-image: url(assets/common/ui/slot_3.png?v=212); } #slotSel button[data-slot="3"].on { background-image: url(assets/common/ui/slot_3_selected.png?v=212); }
  #slotSel button[data-slot="4"] { background-image: url(assets/common/ui/slot_4.png?v=212); } #slotSel button[data-slot="4"].on { background-image: url(assets/common/ui/slot_4_selected.png?v=212); }
  #slotSel button[data-slot="5"] { background-image: url(assets/common/ui/slot_5.png?v=212); } #slotSel button[data-slot="5"].on { background-image: url(assets/common/ui/slot_5_selected.png?v=212); }
  #slotSel button[data-slot="6"] { background-image: url(assets/common/ui/slot_6.png?v=212); } #slotSel button[data-slot="6"].on { background-image: url(assets/common/ui/slot_6_selected.png?v=212); }
  #slotSel button[data-slot="7"] { background-image: url(assets/common/ui/slot_mid.png?v=212); } #slotSel button[data-slot="7"].on { background-image: url(assets/common/ui/slot_mid_selected.png?v=212); }
  #slotSel button:active { filter: brightness(.85); }

  /* 前進(◀ 緑)・後退(▶ 橙)の大きな丸い押ボタン(押している間は沈む。クラス down は ui_layout.js が付ける) */
  #arrowGroup { background: none; border: 0; padding: 0; gap: 14px; }
  #arrowGroup .arrowBtn { width: 76px; height: 76px; border: 0; border-radius: 0; background-color: transparent; background-position: center; background-size: contain; background-repeat: no-repeat; font-size: 0; color: transparent; }
  #btnLeft { background-image: url(assets/common/ui/btn_drive_fwd.png?v=212); }
  #btnRight { background-image: url(assets/common/ui/btn_drive_back.png?v=212); }
  #btnLeft:active, #btnLeft.down { background-image: url(assets/common/ui/btn_drive_fwd_pressed.png?v=212); background-color: transparent; }
  #btnRight:active, #btnRight.down { background-image: url(assets/common/ui/btn_drive_back_pressed.png?v=212); background-color: transparent; }
  body { padding-bottom: 104px; }

  /* 上の情報欄・下の操作パネルの背景 */
  #modeBar { box-sizing: border-box; background: none; border: solid transparent; border-width: 0 24px 6px 24px; border-image: url(assets/common/ui/hud_bar.png?v=212) 0 24 6 24 fill / 0 24px 6px 24px stretch; padding: 8px 0 4px; gap: 8px; color: #dfe8f2; min-height: 56px; align-items: center; }
  #modeBar #modeBarName { flex: 1 1 100%; font-size: 14px; }
  #modeBar > span:not(#modeBarName):not(#missCount) { box-sizing: border-box; border: 8px solid transparent; border-image: url(assets/common/ui/meter_box.png?v=212) 8 fill / 8px stretch; padding: 0 2px; min-width: 56px; text-align: center; font-size: 13px; color: #7dfcd0; font-weight: bold; line-height: 1.1; }
  #modeBar #modeBarScore { margin-left: auto; color: #ffd34d; }
  #modeBar #missCount { margin-left: 4px; font-size: 14px; }
  #toolbar { display: none; }
  body.debug #toolbar { display: flex; }
  #status { display: none; }
  body.debug #status { display: block; }
  #floorPanel, #chockPanel, #controls { box-sizing: border-box; background: none; border: solid transparent; border-width: 12px 16px 8px 16px; border-image: url(assets/common/ui/panel_bg.png?v=212) 12 16 8 16 fill / 12px 16px 8px 16px stretch; margin-top: 2px; }

  /* A-3 必要な時だけ出す: スイッチの説明文は ? を押した時だけ。車の一覧は引き出し式 */
  #swHint { display: none !important; }
  #swHint.show { display: block !important; }
  #btnHelp, #btnSwClose { box-sizing: border-box; width: 36px; height: 36px; padding: 0; margin-left: 8px; vertical-align: middle; border: 0; background: center / contain no-repeat; font-size: 0; color: transparent; cursor: pointer; }
  #btnHelp { background-image: url(assets/common/ui/ic_help.png?v=212); }
  #floorPanel #btnSwClose { width: 36px; height: 36px; padding: 0; margin-left: 4px; border: 0; background: center / contain no-repeat url(assets/common/ui/ic_close.png?v=212); font-size: 0; }
  #deckDrawerHandle { width: 100%; justify-content: flex-start; }
  #deckDrawerHandle .cnt { margin-left: auto; font-weight: normal; }
  #deckDrawer { display: none; }
  #deckDrawer.open { display: block; margin-top: 6px; }

  /* 今は押せない操作(車が道板・扇動板を通っている間など)は、灰色の板にする(ui_layout.js が na を付ける。押すとゲームが理由を出す) */
  #floorPanel .mechRow button.na, #floorPanel .mechRow button.na:active { border-image-source: url(assets/common/ui/btn_plate_disabled.png?v=212); color: #6b7078; text-shadow: none; padding-top: 0; }
  #floorPanel .mechRow button.na::before { opacity: .45; }

  /* モード・難易度・結果の画面のボタンも、同じ板にそろえる(もう一度=緑) */
  .modeBtn { box-sizing: border-box; background: none; border: 14px solid transparent; border-image: url(assets/common/ui/btn_plate.png?v=212) 14 fill / 14px stretch; border-radius: 0; color: #1b1f24; text-shadow: 0 1px 0 rgba(255,255,255,.35); padding: 4px 8px; min-height: 52px; }
  .modeBtn small { color: #3a4048; }
  .modeBtn:active { background: none; border-image-source: url(assets/common/ui/btn_plate_pressed.png?v=212); }
  #btnRetry.modeBtn { border-image-source: url(assets/common/ui/btn_plate_go.png?v=212); }
  #btnRetry.modeBtn:active { border-image-source: url(assets/common/ui/btn_plate_go_pressed.png?v=212); }

  /* ===== スマホ幅: 下にスクロールしなくても、操作が1画面に収まるように詰める(車の一覧だけ、下にスクロールでよい。2026-10-06) =====
     幅 700px 以下だけに効く(パソコンの広い画面は、今まで通り)。ボタンの高さ・余白・段数を減らす */
  @media (max-width: 700px) {
    /* 上のバー: 3段(113px) → 2段。名前の行にまとめ、数値は小さめに */
    #modeBar { border-width: 0 12px 4px 12px; border-image-slice: 0 24 6 24; padding: 4px 0 2px; gap: 3px 5px; min-height: 0; }
    #modeBar #modeBarName { flex: 1 1 auto; font-size: 12px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #modeBar > span:not(#modeBarName):not(#missCount) { border-width: 5px; border-image-slice: 8; padding: 0 1px; min-width: 0; font-size: 11px; line-height: 1.2; }
    #modeBar #modeBarScore { margin-left: auto; }
    #modeBar #missCount { margin-left: 2px; font-size: 12px; }
    #btnDispatch { font-size: 11px; padding: 3px 6px; }

    /* フロア操作: 見出し(スイッチ操作・?・✕)を細く、ボタン4つは2列で小さめ(3段178px → 2段) */
    #floorPanel, #chockPanel, #controls { border-width: 8px 12px 6px 12px; border-image-width: 8px 12px 6px 12px; margin-top: 1px; }
    #floorPanel { padding: 0; }
    #floorPanel h3 { margin: 0 0 2px; font-size: 12px; display: flex; align-items: center; }
    #btnHelp, #floorPanel #btnSwClose { width: 28px; height: 28px; margin-left: 4px; }
    .mechRow { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 6px; margin-top: 4px; }
    #floorPanel .mechRow button, #chockPanel button, #btnOrient, #btnOrientCar, #deckDrawerHandle { min-height: 36px; font-size: 12px; padding: 0 6px 0 4px; border-width: 10px; border-image-width: 10px; }
    #floorPanel .mechRow button { width: 100%; justify-content: flex-start; }

    /* 輪止め: スロット1〜6を1段(98px → 40px)。説明文は隠す。ボタン3つも1段にまとめる */
    #slotSel > span { display: none; }
    #slotSel { gap: 6px; flex-wrap: nowrap; justify-content: space-between; }
    #slotSel button { width: 42px; height: 42px; flex: 0 0 auto; }
    #chockPanel { gap: 4px 6px; }
    #chockPanel #btnChockSet { flex: 1 1 0; min-width: 0; font-size: 11px; }
    #chockPanel #btnChockFront, #chockPanel #btnChockRear { flex: 0 0 auto; min-width: 48px; }
    #chockPanel #btnChockFront::after, #chockPanel #btnChockRear::after { font-size: 11px; }
    /* イージーの説明文(黄色い案内・輪止めの説明・フロアのメッセージ)は、小さい字で1段分の幅に */
    #chockPanel #chockLabel { flex: 1 1 100%; font-size: 11px; line-height: 1.3; }
    #gameStatus { font-size: 12px; line-height: 1.35; padding: 4px 10px; }
    #floorStatus { margin-top: 2px; font-size: 11px; min-height: 0; }
  }
</style>
<script>
  if (/debug/.test(location.search + location.hash)) document.addEventListener('DOMContentLoaded', function () { document.body.classList.add('debug'); });
  // 長押しメニュー(画像を保存/コピー)・ピンチ/ダブルタップ拡大を無効化
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }); });
  document.addEventListener('selectstart', function (e) { e.preventDefault(); });
  document.addEventListener('dragstart', function (e) { e.preventDefault(); });
</script></head>
<body>

<div id="toolbar">
  <strong>確認用(debug)</strong>
  <label><input type="checkbox" id="chkHit"> スロット当たり判定</label>
  <label><input type="checkbox" id="chkPin"> pinMarks</label>
  <label><input type="checkbox" id="chkFloors" checked> フロア画像</label>
  <label><input type="checkbox" id="chkTractor" checked> トラクタ</label>
  <label><input type="checkbox" id="chkWheel" checked> wheelレイヤー</label>
  <label><input type="checkbox" id="chkFg" checked> fgレイヤー</label>
  <span id="missCount" style="margin-left:auto; color:#ff8080; font-weight:bold;">ミス: 0</span>
</div>

<div id="modeBar">
  <strong id="modeBarName"></strong>
  <span id="modeBarTime"></span>
  <span id="modeBarCycles"></span>
  <span id="modeBarCars"></span>
  <span id="modeBarHeight"></span>
  <button id="btnDispatch" type="button" title="積めない荷物だと思ったら、配車担当に連絡する">配車に連絡</button>
  <span id="modeBarScore" style="margin-left:auto; font-weight:bold;"></span>
</div>
<div id="cycleBanner"></div>

<div id="stickyTop">
<div id="stageWrap">
  <canvas id="stage"></canvas>
  <canvas id="miniMap" style="display:none"></canvas>
</div>
<div id="status">loading...</div>
<div id="gameStatus">準備中...</div>
</div>

<div id="floorPanel">
  <h3><span id="floorTitle">スイッチ操作</span> <button id="btnSwClose" type="button">閉じる</button></h3>
  <div id="swHint">トレーラーについているスイッチ(とその周り)をタップすると、そのスイッチを操作できます。<br>前側(1番・2番の柱の間)/ 後ろ側(中央の柱の後ろ。3番・宙段)/ アウトリガーとタイヤ(ランプ盤・6ボタン)</div>
  <div id="swPanel"></div>
  <div class="mechRow">
    <button id="btnStopper"></button>
    <button id="btnRamp"></button>
    <button id="btnBridge"></button>
    <button id="btnF2Flap"></button>
  </div>
  <div id="floorStatus">-</div>
</div>

<div id="chockPanel">
  <div id="slotSel"><span>輪止め・落し蓋のスロット:</span><button type="button" data-slot="1">1</button><button type="button" data-slot="2">2</button><button type="button" data-slot="3">3</button><button type="button" data-slot="4">4</button><button type="button" data-slot="5">5</button><button type="button" data-slot="6">6</button></div>
  <span id="chockLabel">-</span>
  <button id="btnLid">落し蓋を開ける</button>
  <button id="btnChockSet">輪止めをセット</button>
  <button id="btnChockFront" title="輪止めを前方(キャビン側)へ">◀ 前へ</button>
  <button id="btnChockRear" title="輪止めを後方(道板側)へ">後ろへ ▶</button>
</div>
<div id="controls">
  <div id="deckAll"></div>
  <div id="deckHard">
    <div id="hardRow">
      <button id="btnPrevCar" class="carNav" type="button" title="前の車">◀</button>
      <canvas id="carPreview" width="140" height="90"></canvas>
      <button id="btnNextCar" class="carNav" type="button" title="次の車">▶</button>
    </div>
    <div class="previewLabel" id="deckCount">車(タップで入場)</div>
    <button id="btnOrient" type="button">向き: 前向き(頭から)</button>
    <button id="btnOrientCar" type="button" style="display:none">待機中の車の向き</button>
  </div>
  <div id="arrowGroup">
    <button id="btnRight" class="arrowBtn" title="道板方向へ後退">▶</button>
    <button id="btnLeft" class="arrowBtn" title="フロア方向へ前進">◀</button>
  </div>
</div>

<div id="modeOverlay" class="overlay">
  <div class="card">
    <h2>キャリアカーゲーム</h2>
    <p>モードを選んでください</p>
    <button class="modeBtn" data-mode="time">タイムアタック<small></small></button>
    <button class="modeBtn" data-mode="real">リアルモード<small></small></button>
    <button class="modeBtn" data-mode="sim">シミュレーション<small></small></button>
  </div>
</div>
<div id="diffOverlay" class="overlay">
  <div class="card">
    <h2 id="diffTitle">難易度</h2>
    <p>難易度を選んでください</p>
    <button class="modeBtn" data-diff="easy">イージー<small>積む車が全部見える・解説あり</small></button>
    <button class="modeBtn" data-diff="normal">ノーマル<small>積む車が全部見える・解説なし</small></button>
    <button class="modeBtn" data-diff="hard">ハード<small>車は1台ずつ(◀▶で選ぶ)・解説なし</small></button>
    <button class="modeBtn" id="btnDiffBack" type="button">戻る</button>
  </div>
</div>
<div id="resultOverlay" class="overlay">
  <div class="card">
    <h2 id="resultTitle"></h2>
    <div id="resultBody"></div>
    <div id="resultScore"></div>
    <button id="btnRetry" class="modeBtn">もう一度</button>
    <button id="btnModeSelect" class="modeBtn">モード選択へ</button>
  </div>
</div>

<script src="js/trailer_config.js?v=212"></script>
<script src="js/trailer_assets.js?v=212"></script>
<script src="js/car_library.js?v=212"></script>
<script src="js/car_dims.js?v=212"></script>
<script src="js/floor_mech.js?v=212"></script>
<script src="js/loadable.js?v=212"></script>
<script src="js/main.js?v=212"></script>
<script src="js/game.js?v=212"></script>
<script src="js/floor_controls.js?v=212"></script>
<script src="js/modes.js?v=212"></script>
<script src="js/dispatch.js?v=212"></script>
<script src="js/ui_layout.js?v=212"></script>
</body>
</html>
