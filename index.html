  /* ===== 2026-10-07 スマホの縦・横: 全体の共通 ===== */
  /* 切り欠き(ノッチ)・角丸を避ける: viewport-fit=cover の時だけ値が入る(普通のブラウザは 0) */
  body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
  /* 上の情報欄(経過・スコア・ミス)は、スクロールしても上に残す。ステージ(stickyTop)はその下に付く(高さは ui_layout.js が --mbh に入れる) */
  #modeBar { position: sticky; top: 0; z-index: 21; background-color: #111; }   /* 背景を塗っておく(スクロールで下の物が透けないように) */
  #stickyTop { top: var(--mbh, 0px); }
  /* スマホ縦: body が overflow-x:hidden のままだと上の固定部分がスクロールで流れてしまう(スクロールコンテナになるため)。clip にして、情報欄+ステージ+指示を上に残す。
     パソコン・タブレットは、今まで通り(画面が低いので、固定すると操作盤の場所が足りなくなる) */
  @media (max-width: 700px) and (orientation: portrait) { body { overflow-x: clip; } }
  /* 小さい画面でも、モード・難易度・結果・配車連絡のカードが画面からはみ出さない */
  .overlay .card { box-sizing: border-box; max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px); overflow-y: auto; }

  /* ===== スマホの横画面(横長で高さが低い: 例 844×390・915×412・667×375): 左にステージ・右に操作盤の2列 =====
     パソコンの横長と同じ「ステージ+操作盤」の並びを、スクロールなしの1画面に収める。ページ自体はスクロールせず、右の列だけ中でスクロールする。
     判定は main.js の VIEW.layout() と同じ式(orientation: landscape かつ高さ 520px 以下) */
  @media (orientation: landscape) and (max-height: 520px) {
    :root { --side: clamp(300px, 40vw, 380px); }
    html, body { height: 100%; overflow: hidden; overflow-x: hidden; }
    body, body.tutorial { box-sizing: border-box; height: 100vh; height: 100dvh; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto auto minmax(0, 1fr); padding-bottom: 0; }
    #toolbar, body.debug #toolbar { display: none; }
    #modeBar #modeBarName { flex: 1 1 60px; }
    #modeBar { gap: 3px 4px; border-width: 0 8px 4px 8px; }
    #modeBar #missCount { margin-left: 0; }
    #modeBar #modeBarCycles { display: none; }   /* サイクル数は縦・PCで見られる。横画面は場所が足りないので省く */
    @media (max-width: 760px) {   /* 幅が狭い横画面(667×375 など): 右の列を細く、モード名は省いて(積込数・スコアを1段に)、ステージを広く残す */
      :root { --side: 288px; }
      #modeBar #modeBarName { display: none; }
      body.tutorial #modeBar #modeBarName { display: block; }
      #modeBar { gap: 3px 4px; }
      #gameStatus { font-size: 12px; line-height: 1.35; padding: 3px 8px; }
    }
    #modeBar { grid-column: 1; grid-row: 1; position: static; }
    #cycleBanner { grid-column: 1; grid-row: 2; font-size: 12px; padding: 4px 10px; }
    #stickyTop { grid-column: 1; grid-row: 3; position: static; display: flex; flex-direction: column; min-height: 0; min-width: 0; box-shadow: none; }
    #stageWrap { flex: 1 1 0; min-height: 0; width: auto; }
    #stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    #gameStatus { flex: none; max-height: 4.6em; overflow-y: auto; }
    #opsPanel { grid-column: 2; grid-row: 1 / 4; min-height: 0; height: 100%; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 0 0 92px; background: #111; border-left: 2px solid #333; }
    #opsPanel #floorPanel, #opsPanel #chockPanel, #opsPanel #controls { margin-top: 0; }
    /* 前進・後退のボタンは、右の列の右下に重ねる(右の列は下に余白を取ってある) */
    #arrowGroup { right: calc(10px + env(safe-area-inset-right)); bottom: 8px; gap: 12px; }
    #arrowGroup .arrowBtn { width: 68px; height: 68px; }
    /* 輪止めのボタン: 「セット」は1段、「前へ・後ろへ」は半分ずつ(狭い列で字が縦に割れないように) */
    #chockPanel #btnChockSet { flex: 1 1 100%; }
    #chockPanel #btnChockFront, #chockPanel #btnChockRear { flex: 1 1 0; }
    /* チュートリアル: パネルは左の列のステージの下(縦と同じ並び)。高さを抑えて、ステージを広く残す */
    body.tutorial #stickyTop { display: flex; flex-direction: column; flex-wrap: nowrap; align-items: stretch; }
    body.tutorial #stageWrap { flex: 1 1 0; min-width: 0; }
    body.tutorial #tutPanel { flex: none; max-height: none; overflow: visible; border-left: 0; border-top: 2px solid #5a86b4; padding: 3px 10px 5px; font-size: 12px; line-height: 1.4; }
    body.tutorial #tutPanel .tutScroll { max-height: 64px; }
    body.tutorial #tutPanel .tutTitle { font-size: 13px; margin: 1px 0 0; }
    body.tutorial #tutPanel .tutBtns { margin-top: 3px; }
    body.tutorial #tutPanel button { min-height: 34px; }
    body.tutorial #tutPanel button.tutFold { min-height: 34px; padding: 2px 10px; }
    body.tutorial #status, body.tutorial #gameStatus { flex: none; order: 0; }
    body.tutorial #gameStatus { display: none; }   /* チュートリアルの案内パネルと同じ内容なので、横画面では省いてステージを広く(警告はパネルにも出る) */
    /* オーバーレイ(モード・難易度・結果・配車連絡): 低い画面でも収まるよう、余白・ボタンを詰める */
    .overlay .card { padding: 10px 18px 12px; width: min(94vw, 460px); }

    .dispatchSpeech { font-size: 16px; line-height: 1.5; padding: 10px; }
  }

// 読むファイルの組み合わせがトレーラーごとに違う(設定・フロア機構・積める判定・操作ボタン)ので、ここで決めて順番に読む。画像・JSを差し替えたら ?v= を上げる
(function () {
  var m = /[#&]trailer=(semi-6b?)(?:&|$)/.exec(location.hash), id = window.TRAILER_ID = m ? m[1] : 'semi-6', V = '?v=279.1.9';
  var list = id === 'semi-6b'
    ? ['trailer_config_semi6b', 'car_library', 'car_dims', 'car_tires', 'floor_mech_6b', 'loadable_6b', 'main', 'game', 'floor_controls_6b', 'modes', 'dispatch', 'ui_layout']
    : ['trailer_config', 'trailer_assets', 'car_library', 'car_dims', 'car_tires', 'floor_mech', 'loadable', 'main', 'game', 'floor_controls', 'modes', 'tutorial', 'dispatch', 'ui_layout'];
