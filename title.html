<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>僕らは陸送屋(仮)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* スマホ操作: 長押しの選択・コピー・画像メニュー・ダブルタップ拡大・タップ時の青い枠を出さない */
  html, body, button, img, canvas, div, span { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
  img, canvas { -webkit-user-drag: none; }  /* メイン画面: 夕暮れの道を走るキャリアカー(ヘッドだけ右から見えている)+左にゲームモード。
     モード → 難易度 → トレーラーが左へ走り去ってゲーム画面(index.html#mode=..&diff=..)へ */
  :root {
    --accent: #33b891;
    --accent-deep: #1f8a6b;
    --ink: #eef3f1;
    --ink-dim: #a9b7b2;
    --panel: rgba(14, 22, 24, .78);
    --panel-hi: rgba(28, 44, 46, .92);
    --line: rgba(255, 255, 255, .14);
    --road: #2b3036;
    --h: min(28vh, 24vw);                 /* トレーラーの高さ */
    --rig-w: calc(var(--h) * 1034 / 201);  /* rig.png の縦横比 */
    --road-top: 74%;                       /* 車輪が乗る路面の高さ */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10161c; color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  .disp { font-family: "Mochiy Pop One", "Noto Sans JP", sans-serif; }

  /* ---------- 背景 ---------- */
  .scene { position: fixed; inset: 0; overflow: hidden;
    background: linear-gradient(#22324a 0%, #3d4f6b 28%, #c98a6b 58%, #f0c27f 70%, #f6d9a0 74%); }
  .sun { position: absolute; left: 58%; top: 50%; width: 15vh; height: 15vh; border-radius: 50%;
    background: radial-gradient(#fff3cf 0 40%, #ffd98a 60%, rgba(255, 200, 120, 0) 72%); filter: blur(.5px); }
  .layer { position: absolute; left: 0; width: 200%; background-repeat: repeat-x; background-size: 50% 100%;
    animation: scroll linear infinite; }
  /* 中央分離帯のガードレール(手前・速い) */
  .rail { bottom: calc(100% - var(--road-top) + .3vh); height: 2.6vh; animation-duration: 3.2s;
    background-image:
      linear-gradient(#cfd6db 0 22%, transparent 22% 48%, #aab3ba 48% 66%, transparent 66%),
      linear-gradient(90deg, #7d868d 0 3px, transparent 3px);
    background-size: 50% 100%, 6vh 100%; }
  .road { position: absolute; left: 0; right: 0; top: var(--road-top); bottom: 0;
    background: linear-gradient(#3a4047 0 4%, var(--road) 4% 100%); }
  .road .lane { position: absolute; left: 0; width: 200%; top: 62%; height: 1.1vh; animation: scroll .9s linear infinite;
    background: repeating-linear-gradient(90deg, #e9e3cf 0 7vh, transparent 7vh 16vh); }
  .road .edge { position: absolute; left: 0; right: 0; top: 4%; height: .5vh; background: #e9e3cf; opacity: .8; }
  @keyframes scroll { from { transform: translateX(-50%); } to { transform: translateX(0); } }   /* 車は左へ進むので景色は右へ */

  /* ---------- トレーラー ---------- */
  .rig { position: absolute; height: var(--h); width: var(--rig-w);
    left: calc(100% - var(--rig-w) * .40);                 /* ヘッド(左の約4割)だけが右端から見える */
    top: calc(var(--road-top) + 7vh - var(--h)); will-change: transform; }   /* 手前の車線を走る */
  .rig .shadow { position: absolute; left: 1%; right: 0; bottom: -4%; height: 9%;
    background: radial-gradient(closest-side, rgba(0, 0, 0, .45), transparent); }
  .rig .body { position: absolute; inset: 0; width: 100%; height: 100%; animation: bob .42s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-.35%); } }
  /* 車輪: 外枠(位置と大きさだけ。左上の角で置く)+中の画像(回すだけ)。
     translate/rotate の個別プロパティや translate(-50%) は端末によって効き方が違い、車輪が車体からずれたため使わない */
  .rig .wheel { position: absolute; }
  .rig .wheel img { display: block; width: 100%; height: 100%; animation: spin .55s linear infinite; transform-origin: 50% 50%; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }   /* 左へ進む = 反時計回り */
  .rig.depart { transition: transform 1.7s cubic-bezier(.55, 0, .85, .35); transform: translateX(calc(-100vw - var(--rig-w) * .65)); }
  .rig.depart .wheel img { animation-duration: .18s; }
  .scene.fast .layer, .scene.fast .lane { animation-duration: .5s; }
  .scene.fast .mountains { animation-duration: 30s; }
  .scene.fast .buildings { animation-duration: 12s; }
  .scene.fast .houses { animation-duration: 5s; }

  /* ---------- メニュー(左の空き枠) ---------- */
  .menu { position: fixed; z-index: 2; left: max(3vw, env(safe-area-inset-left)); top: 4vh;
    width: min(440px, 46vw); max-height: calc(var(--road-top) - 6vh); display: flex; flex-direction: column; gap: 1.6vh;
    transition: opacity .45s, transform .45s; }
  .menu.leave { opacity: 0; transform: translateX(-30px); pointer-events: none; }
  .logo { margin: 0; font-size: clamp(22px, 5.4vh, 52px); line-height: 1.1; letter-spacing: .02em;
    color: #fff; text-shadow: 0 3px 0 var(--accent-deep), 0 6px 18px rgba(0, 0, 0, .45); }
  .logo .kari { font-size: .5em; color: #ffe2b0; text-shadow: none; }
  .sub { margin: -.6vh 0 .4vh; font-size: clamp(11px, 1.8vh, 15px); color: #ffe9c8; text-shadow: 0 1px 4px rgba(0, 0, 0, .6); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1.6vh; backdrop-filter: blur(6px);
    display: flex; flex-direction: column; gap: 1.1vh; overflow: auto; }
  .panel[hidden] { display: none; }
  .panel h2 { margin: 0 0 .2vh; font-size: clamp(13px, 2.2vh, 18px); color: var(--ink-dim); font-weight: 700; letter-spacing: .08em; }
  .card { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
    padding: clamp(8px, 1.6vh, 16px) clamp(10px, 1.8vh, 18px); border-radius: 12px; background: var(--panel-hi);
    border: 1px solid var(--line); transition: background .15s, border-color .15s, transform .1s; }
  .card:hover, .card:focus-visible { border-color: var(--accent); background: rgba(40, 70, 64, .95); }
  .card:active { transform: scale(.985); }
  .card .ico { width: clamp(30px, 5vh, 44px); height: clamp(30px, 5vh, 44px); border-radius: 10px; display: grid; place-items: center;
    background: var(--accent); color: #fff; font-size: clamp(15px, 2.6vh, 22px); }
  .card b { display: block; font-size: clamp(14px, 2.6vh, 21px); }
  .card small { display: block; margin-top: 2px; font-size: clamp(10px, 1.6vh, 13px); color: var(--ink-dim); line-height: 1.4; }
  .card .go { color: var(--accent); font-size: 1.3em; }
  .card.easy .ico { background: #3fae6a; } .card.normal .ico { background: #d79a2b; } .card.hard .ico { background: #d0533f; }
  .back { all: unset; cursor: pointer; align-self: flex-start; padding: 6px 12px; border-radius: 999px; font-size: clamp(12px, 1.9vh, 15px);
    color: var(--ink); border: 1px solid var(--line); background: rgba(255, 255, 255, .06); }
  .back:hover, .back:focus-visible { border-color: var(--accent); }

  /* 縦長の画面: メニューを広げ、トレーラーは下に */
  @media (max-aspect-ratio: 4/5) {
    :root { --h: 15vh; --road-top: 82%; }
    .menu { width: auto; right: max(4vw, env(safe-area-inset-right)); }
    .rig { left: calc(100% - var(--rig-w) * .34); }
  }
  @media (prefers-reduced-motion: reduce) {
    .layer, .lane, .rig .body, .rig .wheel img { animation: none; }
    .rig.depart { transition: none; }
  }

  /* ---- D28 背景(時間帯・雨) assets/ui/scenery/title_scenery_example.css ---- */
/* メイン画面(title.html)の新しい背景の組み込み例。DEV_HANDOFF_MEMO.md の D28・D29 を参照。make_example_css.py で作った。
   .scene に時間帯 t-dusk / t-sunrise / t-day / t-night のどれか1つと、雨なら w-rain を付ける(付け方は title_scenery_example.js) */
:root { --road-h: 26vh; --rd-ph: 50vh; --rd-p: 83.3vh; --rd-oy: 24.1vh; --rd-dur: 3.23s; }
@media (max-aspect-ratio: 4/5) { :root { --road-h: 18vh; --rd-ph: 36vh; --rd-p: 117.8vh; --rd-oy: 18vh; --rd-dur: 3.84s; } }
/* 景色の層: 1枚の幅 --tw = 高さ x 絵の縦横比。横に並べて translateX(-tw) → 0 でずらす(車は左へ進むので景色は右へ) */
.sl { position: absolute; left: 0; width: calc(100% + var(--tw)); background-repeat: repeat-x; background-size: var(--tw) 100%;
  animation: slide linear infinite; will-change: transform; }
@keyframes slide { from { transform: translateX(calc(-1 * var(--tw))); } to { transform: translateX(0); } }
.far   { bottom: calc(100% - var(--road-top) + 9vh);   height: 24vh;  --tw: calc(24vh * 4096 / 384);  animation-duration: 256s; }
.mid   { bottom: calc(100% - var(--road-top) + 6vh);   height: 16vh;  --tw: calc(16vh * 6144 / 320);  animation-duration: 88s; }
.near  { bottom: calc(100% - var(--road-top) + 1.2vh); height: 19vh;  --tw: calc(19vh * 8192 / 256);  animation-duration: 60s; }
.grail { bottom: calc(100% - var(--road-top) - .6vh);  height: 3.4vh; --tw: calc(3.4vh * 1024 / 96); animation-duration: .79s; }
/* 道路: 真上から見た絵(road_*.webp 3072x1280 = 横20m x 奥行き8.33m)を、奥へ60度傾けて置く。奥は小さくゆっくり、手前は大きく速く流れる。
   消える線(地平線)は路面の上端から 24vh 上(縦長画面は 50vh)。トレーラーのタイヤ(路面の上端から7vh下)は絵の上から約43%の行=第1車線の手前寄りに乗る。
   数値の出し方: R=路面の高さ, V=地平線までの高さ, 傾き60度, ph=絵の高さ → perspective = ph*sin60*(R+V)/R, origin = perspective*cot60 - V。速さはタイヤの回転(.55秒)に合わせた */
.road3d { position: absolute; left: 0; right: 0; top: var(--road-top); height: var(--road-h); overflow: hidden;
  perspective: var(--rd-p); perspective-origin: 50% var(--rd-oy); }
.road3d .strip { position: absolute; left: 0; top: 0; height: var(--rd-ph); --tw: calc(var(--rd-ph) * 2.4); width: calc(100% + var(--tw));
  background-repeat: repeat-x; background-size: var(--tw) 100%; transform-origin: 0 0; animation: road3d var(--rd-dur) linear infinite; will-change: transform; }
@keyframes road3d { from { transform: rotateX(60deg) translateX(calc(-1 * var(--tw))); } to { transform: rotateX(60deg) translateX(0); } }
.stars { position: absolute; left: 0; right: 0; top: 0; height: 60%; background: url(assets/ui/scenery/stars.webp?v=1) repeat; background-size: 512px 256px; opacity: 0; }
.rain { position: absolute; inset: -10% 0 0 0; pointer-events: none; background: url(assets/ui/scenery/rain.webp?v=1) repeat; display: none; z-index: 1;
  animation: rainfall .5s linear infinite; }
.rain.r2 { background-size: 340px 340px; opacity: .55; animation-duration: .8s; }
@keyframes rainfall { from { background-position: 0 0; } to { background-position: -90px 512px; } }
.scene.w-rain .rain { display: block; }
.scene.w-rain .sun { display: none; }
.scene.w-rain .far { opacity: .35; filter: saturate(.5); }
.scene.w-rain .mid { filter: saturate(.6) brightness(.85); opacity: .85; }
.scene.w-rain .near { filter: saturate(.75) brightness(.88); }
.scene.t-night .stars { opacity: .9; } .scene.t-night.w-rain .stars { opacity: 0; }
.scene.fast .sl { animation-duration: .4s; } .scene.fast .far { animation-duration: 60s; } .scene.fast .mid { animation-duration: 18s; } .scene.fast .near { animation-duration: 8s; }
.scene.fast .road3d .strip { animation-duration: 1s; }
/* トラック(rig.png は昼の明るさ)を時間帯・雨に合わせて暗くする。夜はヘッドライトの光 */
.scene.t-sunrise .rig .body, .scene.t-sunrise .rig .wheel img { filter: brightness(.93); }
.scene.w-rain .rig .body, .scene.w-rain .rig .wheel img { filter: brightness(.82) saturate(.85); }
.scene.t-night .rig .body, .scene.t-night .rig .wheel img { filter: brightness(.5) saturate(.8); }
.scene.t-night .rig::before { content: ""; position: absolute; right: 96.5%; top: 74%; width: 55vh; height: 20%; pointer-events: none;
  background: linear-gradient(to left, rgba(255, 236, 190, .55), rgba(255, 236, 190, 0)); clip-path: polygon(0 0, 100% 42%, 100% 58%, 0 100%); filter: blur(3px); }
.scene.t-night .rig::after { content: ""; position: absolute; right: 88%; top: 90%; width: 60vh; height: 16%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 230, 170, .30), rgba(255, 230, 170, 0)); }
@media (prefers-reduced-motion: reduce) { .sl, .road3d .strip, .rain { animation: none; } }
/* dusk */
.scene.t-dusk { background: linear-gradient(#22324a 0%, #3d4f6b 28%, #c98a6b 58%, #f0c27f 70%, #f6d9a0 74%); }
.scene.t-dusk.w-rain { background: linear-gradient(#2a2f3a 0%, #4a4f5c 35%, #7d7470 62%, #9a8c80 74%); }
.scene.t-dusk .sun { left: 58%; top: 41%; width: 15vh; height: 15vh; background: radial-gradient(#fff3cf 0 40%, #ffd98a 60%, rgba(255, 200, 120, 0) 72%); }
.scene.t-dusk .far { background-image: url(assets/ui/scenery/far_mountains_dusk.webp?v=1); }
.scene.t-dusk .mid { background-image: url(assets/ui/scenery/mid_town_dusk.webp?v=1); }
.scene.t-dusk .near { background-image: url(assets/ui/scenery/near_houses_dusk.webp?v=1); }
.scene.t-dusk .grail { background-image: url(assets/ui/scenery/guardrail_dusk.webp?v=1); }
.scene.t-dusk .road3d .strip { background-image: url(assets/ui/scenery/road_dusk.webp?v=2); }
.scene.t-dusk.w-rain .road3d .strip { background-image: url(assets/ui/scenery/road_dusk_wet.webp?v=2); }
/* sunrise */
.scene.t-sunrise { background: linear-gradient(#34436a 0%, #6f7aa3 30%, #d6a3aa 58%, #f3c8a6 70%, #f8e2c4 74%); }
.scene.t-sunrise.w-rain { background: linear-gradient(#3b4150 0%, #5d6272 35%, #8f8890 62%, #ab9f9e 74%); }
.scene.t-sunrise .sun { left: 50%; top: 42%; width: 14vh; height: 14vh; background: radial-gradient(#fff6e6 0 38%, #ffd2b0 58%, rgba(255, 190, 170, 0) 72%); }
.scene.t-sunrise .far { background-image: url(assets/ui/scenery/far_mountains_sunrise.webp?v=1); }
.scene.t-sunrise .mid { background-image: url(assets/ui/scenery/mid_town_sunrise.webp?v=1); }
.scene.t-sunrise .near { background-image: url(assets/ui/scenery/near_houses_sunrise.webp?v=1); }
.scene.t-sunrise .grail { background-image: url(assets/ui/scenery/guardrail_sunrise.webp?v=1); }
.scene.t-sunrise .road3d .strip { background-image: url(assets/ui/scenery/road_sunrise.webp?v=2); }
.scene.t-sunrise.w-rain .road3d .strip { background-image: url(assets/ui/scenery/road_sunrise_wet.webp?v=2); }
/* day */
.scene.t-day { background: linear-gradient(#3f78bd 0%, #6fa3d6 32%, #a9cae6 60%, #d3e3f0 74%); }
.scene.t-day.w-rain { background: linear-gradient(#5d6873 0%, #7f8a95 35%, #a4adb5 62%, #bcc3c9 74%); }
.scene.t-day .sun { left: 72%; top: 9%; width: 11vh; height: 11vh; background: radial-gradient(#ffffff 0 34%, rgba(255, 252, 235, .7) 50%, rgba(255, 255, 255, 0) 72%); }
.scene.t-day .far { background-image: url(assets/ui/scenery/far_mountains_day.webp?v=1); }
.scene.t-day .mid { background-image: url(assets/ui/scenery/mid_town_day.webp?v=1); }
.scene.t-day .near { background-image: url(assets/ui/scenery/near_houses_day.webp?v=1); }
.scene.t-day .grail { background-image: url(assets/ui/scenery/guardrail_day.webp?v=1); }
.scene.t-day .road3d .strip { background-image: url(assets/ui/scenery/road_day.webp?v=2); }
.scene.t-day.w-rain .road3d .strip { background-image: url(assets/ui/scenery/road_day_wet.webp?v=2); }
/* night */
.scene.t-night { background: linear-gradient(#050913 0%, #0b1428 40%, #1a2541 62%, #2b3655 74%); }
.scene.t-night.w-rain { background: linear-gradient(#07090f 0%, #0f141d 40%, #1b212c 62%, #262d3a 74%); }
.scene.t-night .sun { left: 70%; top: 12%; width: 7vh; height: 7vh; background: radial-gradient(circle at 42% 40%, #fbf6e4 0 52%, #e9e2c8 62%, rgba(240, 235, 210, 0) 72%); box-shadow: 0 0 6vh rgba(220, 225, 255, .25); }
.scene.t-night .far { background-image: url(assets/ui/scenery/far_mountains_night.webp?v=1); }
.scene.t-night .mid { background-image: url(assets/ui/scenery/mid_town_night.webp?v=1); }
.scene.t-night .near { background-image: url(assets/ui/scenery/near_houses_night.webp?v=1); }
.scene.t-night .grail { background-image: url(assets/ui/scenery/guardrail_night.webp?v=1); }
.scene.t-night .road3d .strip { background-image: url(assets/ui/scenery/road_night.webp?v=2); }
.scene.t-night.w-rain .road3d .strip { background-image: url(assets/ui/scenery/road_night_wet.webp?v=2); }

/* ---- 2026-10-07 道路・景色の継ぎ目で一瞬白く(背景が透けて)見える対策 ----
   (1) 路面の下に暗い路面色を敷く: タイルの継ぎ目・端のサブピクセルのすき間・画像の読み込み前に、空の明るい色ではなく路面の色が見えるようにする
   (2) backface-visibility と translate3d で、継ぎ目(ループの折り返し)で GPU のレイヤーが作り直されないようにする
   (3) 画像を読み込み終えてからアニメーションを始める(.ready が付くまでは路面・景色を出さない。3秒で打ち切り) */
.road3d { background: #3b4046; backface-visibility: hidden; }
.road3d .strip, .sl { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
@keyframes slide { from { transform: translate3d(calc(-1 * var(--tw)), 0, 0); } to { transform: translate3d(0, 0, 0); } }
.scene:not(.ready) .sl, .scene:not(.ready) .road3d { opacity: 0; }
.scene .sl, .scene .road3d { transition: opacity .35s ease; }
.scene.ready .sl, .scene.ready .road3d { opacity: 1; }
.scene.ready.w-rain .far { opacity: .35; } .scene.ready.w-rain .mid { opacity: .85; }

  /* ---- D29 枠なしメニュー assets/ui/title_menu_example.css ---- */
/* メイン画面(title.html)のタイトル・メニューを、背景に溶けこむ「枠なし」のデザインにする例。DEV_HANDOFF_MEMO.md の D29 を参照。
   title.html の <style> の最後(背景の例 title_scenery_example.css の後)に足すだけで効く。HTML の変更は1か所だけ:
   Google Fonts の Noto Sans JP に太さ 900 を足す(wght@500;700 → wght@500;700;900)。
   読みやすさ: 黒い箱の代わりに、画面の左側だけを背景になじむ暗いグラデーションで沈め、文字に影を付ける。 */

/* ---- 文字の後ろの暗がり(メニューと一緒に消える。時間帯で色味を変える) ---- */
.menu::before { content: ""; position: fixed; z-index: -1; left: 0; top: 0; bottom: 0; width: 62vw; pointer-events: none;
  background: linear-gradient(90deg, rgba(6, 10, 18, .66) 0%, rgba(6, 10, 18, .44) 32%, rgba(6, 10, 18, .14) 50%, rgba(6, 10, 18, 0) 62%); }
.scene.t-day ~ .menu::before { background: linear-gradient(90deg, rgba(10, 28, 52, .62) 0%, rgba(10, 28, 52, .40) 32%, rgba(10, 28, 52, .12) 50%, rgba(10, 28, 52, 0) 62%); }
.scene.t-sunrise ~ .menu::before { background: linear-gradient(90deg, rgba(24, 18, 40, .62) 0%, rgba(24, 18, 40, .40) 32%, rgba(24, 18, 40, .12) 50%, rgba(24, 18, 40, 0) 62%); }

/* ---- タイトル ---- */
.menu { top: 7vh; gap: 0; width: min(460px, 42vw); }
.logo { white-space: nowrap; font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: clamp(24px, min(6.4vh, 9.4vw), 62px); line-height: 1.05; letter-spacing: .06em;
  color: #fff; text-shadow: 0 2px 14px rgba(0, 0, 0, .45), 0 1px 2px rgba(0, 0, 0, .35); }
.logo .kari { font-size: .38em; font-weight: 700; letter-spacing: .12em; color: #7fe0c0; margin-left: .35em; text-shadow: 0 1px 8px rgba(0, 0, 0, .5); }
.sub { display: flex; align-items: center; gap: .9em; margin: 1.4vh 0 4.2vh; font-size: clamp(11px, 1.75vh, 14px); font-weight: 500; letter-spacing: .2em;
  color: rgba(255, 255, 255, .88); text-shadow: 0 1px 6px rgba(0, 0, 0, .65); }
.sub::before { content: ""; flex: none; width: 2.6em; height: 2px; background: var(--accent); box-shadow: 0 0 6px rgba(51, 184, 145, .6); }

/* ---- モード・難易度の一覧(箱をなくし、細い線で区切る) ---- */
.panel { background: none; border: none; border-radius: 0; padding: 0; gap: 0; backdrop-filter: none; -webkit-backdrop-filter: none; overflow: visible; counter-reset: item; }
.panel h2 { margin: 0 0 1.2vh; font-size: clamp(10px, 1.5vh, 12px); font-weight: 700; letter-spacing: .38em; color: rgba(255, 255, 255, .72); text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
.card { counter-increment: item; position: relative; gap: clamp(12px, 2.2vh, 20px); padding: clamp(10px, 1.8vh, 18px) 4px clamp(10px, 1.8vh, 18px) 16px;
  border: none; border-top: 1px solid rgba(255, 255, 255, .20); border-radius: 0; background: none;
  transition: background .22s ease; }
.card > span { transition: transform .22s ease; }
.card:last-child { border-bottom: 1px solid rgba(255, 255, 255, .20); }
.card::before { content: ""; position: absolute; left: 0; top: 20%; bottom: 20%; width: 3px; border-radius: 2px; background: var(--accent);
  transform: scaleY(0); transition: transform .22s ease; }
.card:hover, .card:focus-visible { border-color: rgba(255, 255, 255, .20); background: linear-gradient(90deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, 0) 85%); }
.card:hover > span, .card:focus-visible > span { transform: translateX(6px); }   /* 区切り線は動かさず、中の文字だけ右へ */
.card:hover::before, .card:focus-visible::before { transform: scaleY(1); }
.card:active { background: linear-gradient(90deg, rgba(51, 184, 145, .22), rgba(51, 184, 145, 0) 85%); }
/* 絵文字のアイコンをやめて、細い番号(01 02 03)にする */
.card .ico { width: auto; height: auto; border-radius: 0; background: none; font-size: 0; display: block; align-self: start; padding-top: .35em; }
.card .ico::before { content: counter(item, decimal-leading-zero); font-size: clamp(12px, 1.9vh, 16px); font-weight: 700; letter-spacing: .08em; color: #7fe0c0; text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
.card.easy .ico, .card.normal .ico, .card.hard .ico { background: none; }
.card.easy .ico::before { color: #79dc9c; } .card.normal .ico::before { color: #f2c060; } .card.hard .ico::before { color: #f08a78; }
.card b { font-size: clamp(16px, 3vh, 25px); font-weight: 700; letter-spacing: .06em; color: #fff; text-shadow: 0 1px 10px rgba(0, 0, 0, .6); }
.card small { margin-top: 4px; font-size: clamp(10px, 1.6vh, 13px); color: rgba(255, 255, 255, .8); text-shadow: 0 1px 6px rgba(0, 0, 0, .75); }
.card .go { color: rgba(255, 255, 255, .45); font-size: 1.4em; transition: transform .22s ease, color .22s ease; }
.card:hover .go, .card:focus-visible .go { color: #7fe0c0; transform: translateX(10px); }
.back { margin-bottom: 1.6vh; padding: 0; border: none; background: none; border-radius: 0; letter-spacing: .2em;
  color: rgba(255, 255, 255, .82); text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
.back:hover, .back:focus-visible { color: #7fe0c0; }

/* ---- 縦長の画面: 暗がりは上から ---- */
@media (max-aspect-ratio: 4/5) {
  .menu { top: 5vh; width: auto; }
  .menu::before, .scene.t-day ~ .menu::before, .scene.t-sunrise ~ .menu::before { width: 100vw; height: 78vh; bottom: auto;
    background: linear-gradient(180deg, rgba(6, 10, 18, .66) 0%, rgba(6, 10, 18, .58) 62%, rgba(6, 10, 18, 0) 100%); }
  .sub { margin-bottom: 3.2vh; }
}

/* ---- 高さの低い画面(スマホ横向き): 余白を詰めて、道路にかからないようにする ---- */
@media (max-height: 480px) and (min-aspect-ratio: 4/5) {
  .menu { top: 4vh; }
  .sub { margin: .8vh 0 2.4vh; }
  .panel h2 { margin-bottom: .6vh; }
  .card { padding-top: 1.1vh; padding-bottom: 1.1vh; }
  .card small { margin-top: 1px; }
}


</style>
<script>
  // 長押しメニュー(画像を保存/コピー)・ピンチ/ダブルタップ拡大を無効化
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }); });
  document.addEventListener('selectstart', function (e) { e.preventDefault(); });
  // 画像の読み込みに失敗したら、間隔を空けて最大4回やり直す(回線が不安定でもトレーラーが出るように)
  window.addEventListener('error', function (e) { var i = e.target; if (!i || i.tagName !== 'IMG') return; var n = (+i.dataset.retry || 0) + 1; if (n > 4) return; i.dataset.retry = n; var s = i.getAttribute('src').replace(/[?&]r=\d+$/, ''); setTimeout(function () { i.src = s + (s.indexOf('?') < 0 ? '?' : '&') + 'r=' + n; }, 400 * n); }, true);
  document.addEventListener('dragstart', function (e) { e.preventDefault(); });
</script></head>

<script>
// メイン画面の時間帯と天気を、開くたびにランダムに決める例(DEV_HANDOFF_MEMO.md D28)。
// title.html の <body> の中、.scene の後で読む。.scene に t-<時間帯> と、雨なら w-rain を付けるだけ。
(function () {
  var scene = document.getElementById('scene'); if (!scene) return;
  // 出やすさ: 夕焼け3・昼3・夜2・朝日2。雨は4回に1回くらい
  var times = ['dusk', 'dusk', 'dusk', 'day', 'day', 'day', 'night', 'night', 'sunrise', 'sunrise'];
  scene.classList.add('t-' + times[Math.floor(Math.random() * times.length)]);
  if (Math.random() < 0.25) scene.classList.add('w-rain');
})();
</script>

<main class="menu" id="menu">
  <h1 class="logo disp">僕らは陸送屋<span class="kari">(仮)</span></h1>
  <p class="sub">キャリアカーに車を積み込もう</p>

  <section class="panel" id="modePanel" aria-labelledby="modeTitle">
    <h2 id="modeTitle">ゲームモード</h2>
    <button class="card" data-mode="time"><span class="ico">⏱</span><span><b>タイムアタック</b><small>制限時間内に何サイクルこなせるか(6分)</small></span><span class="go">›</span></button>
    <button class="card" data-mode="real"><span class="ico">⚠</span><span><b>リアルモード</b><small>ミスした時点で終了。何がダメだったかを表示</small></span><span class="go">›</span></button>
    <button class="card" data-mode="tutsim"><span class="ico">学</span><span><b>チュートリアル/シミュレーション</b><small>操作を覚える・自由に練習する</small></span><span class="go">›</span></button>
  </section>

  <section class="panel" id="diffPanel" aria-labelledby="diffTitle" hidden>
    <button class="back" data-back="mode">‹ 戻る</button>
    <h2 id="diffTitle">難易度</h2>
    <button class="card easy" data-diff="easy"><span class="ico">E</span><span><b>イージー</b><small>積む車が全部見える・解説あり</small></span><span class="go">›</span></button>
    <button class="card normal" data-diff="normal"><span class="ico">N</span><span><b>ノーマル</b><small>積む車が全部見える・解説なし</small></span><span class="go">›</span></button>
    <button class="card hard" data-diff="hard"><span class="ico">H</span><span><b>ハード</b><small>車は1台ずつ(◀▶で選ぶ)・解説なし</small></span><span class="go">›</span></button>
  </section>
  <section class="panel" id="tsPanel" aria-labelledby="tsTitle" hidden>
    <button class="back" data-back="mode">‹ 戻る</button>
    <h2 id="tsTitle">チュートリアル/シミュレーション</h2>
    <button class="card" data-ts="tutorial"><span class="ico">学</span><span><b>チュートリアル</b><small>操作とルールを順番に覚える</small></span><span class="go">›</span></button>
    <button class="card" data-ts="sim"><span class="ico">🛠</span><span><b>シミュレーション</b><small>自由に操作できる練習用。時間制限・終了なし</small></span><span class="go">›</span></button>
  </section>

  <section class="panel" id="trailerPanel" aria-labelledby="trailerTitle" hidden>
    <button class="back" data-back="ts">‹ 戻る</button>
    <h2 id="trailerTitle">トレーラーを選ぶ</h2>
  </section>
</main>

<script>
(function () {
  // 車輪の位置は assets/ui/rig.json(make_title_assets.py が出力)と同じ値
  var RIG = { w: 1034, h: 201, wheels: [
    { k: 'front', cx: 109.0, cy: 170.0, size: 60 },
    { k: 'drive', cx: 328.0, cy: 170.0, size: 60 },
    { k: 'trailer', cx: 933.5, cy: 168.5, size: 60 } ] };
  var GAME_URL = 'index.html';
  // トレーラーの一覧(ここだけ直せば選択肢・ランダム選択が変わる)。modes に入っているモードで使える。
  //   sim = 選択画面に出る(自分で選ぶ)。time/real = 使えるものからランダムに選ばれる(tutorial は semi-6 固定でここは使わない)。
  //   semi-6b を time/real でも使えるようにする時は、modes に 'time', 'real' を足すだけ。
  var TRAILERS = [
    { id: 'semi-6',  name: 'セミトレ(6台+宙段)', desc: '従来のキャリアカー。6台+宙段に積む', modes: ['sim', 'time', 'real'] },
    { id: 'semi-6b', name: 'ロルフォ Blizzard J1(6台)', desc: '新型トレーラー(開発中)', modes: ['sim'] }
  ];
  function pickTrailer(m) {
    var c = TRAILERS.filter(function (t) { return t.modes.indexOf(m) >= 0; });
    return (c.length ? c[Math.floor(Math.random() * c.length)] : TRAILERS[0]).id;
  }
  window.TITLE_TRAILERS = TRAILERS; window.pickTrailer = pickTrailer;   // 確認用
  var NAMES = { tutorial: 'チュートリアル', time: 'タイムアタック', real: 'リアルモード', sim: 'シミュレーション' };
  var $ = function (id) { return document.getElementById(id); };
  var rig = $('rig'), menu = $('menu'), scene = $('scene');

  RIG.wheels.forEach(function (w) {
    var box = document.createElement('div');
    box.className = 'wheel';
    box.style.left = ((w.cx - w.size / 2) / RIG.w * 100) + '%';
    box.style.top = ((w.cy - w.size / 2) / RIG.h * 100) + '%';
    box.style.width = (w.size / RIG.w * 100) + '%';
    box.style.height = (w.size / RIG.h * 100) + '%';
    var img = document.createElement('img');
    img.alt = ''; img.src = 'assets/ui/wheel_' + w.k + '.png';
    box.appendChild(img);
    rig.appendChild(box);
  });

  // 景色・路面の画像を先に読み込んでから動かす(読み込み前の白い瞬間を出さない)
  (function () {
    var urls = [], seen = {};
    ['.far', '.mid', '.near', '.grail', '.road3d .strip'].forEach(function (sel) {
      var el = scene.querySelector(sel); if (!el) return;
      var m = /url\(["']?([^"')]+)["']?\)/.exec(getComputedStyle(el).backgroundImage || '');
      if (m && !seen[m[1]]) { seen[m[1]] = 1; urls.push(m[1]); }
    });
    var left = urls.length, fin = false;
    function ok() { if (fin) return; fin = true; scene.classList.add('ready'); }
    if (!left) { ok(); return; }
    urls.forEach(function (u) { var i = new Image(); i.onload = i.onerror = function () { if (--left <= 0) ok(); }; i.src = u; if (i.decode) i.decode().then(function () {}, function () {}); });
    setTimeout(ok, 3000);
  })();

  var mode = null, leaving = false, trailer = 'semi-6';
  var PANELS = ['mode', 'diff', 'ts', 'trailer'], cur = 'mode';
  function show(panel) {
    cur = panel;
    PANELS.forEach(function (p) { $(p + 'Panel').hidden = p !== panel; });
    var first = document.querySelector('#' + panel + 'Panel .card, #' + panel + 'Panel .back');
    if (first) first.focus({ preventScroll: true });
  }
  function go(m, d, t) {
    trailer = t || 'semi-6';   // t が無い(チュートリアル)時は trailer= を付けない = semi-6
    if (leaving) return;
    leaving = true;
    var url = GAME_URL + '?r=' + Date.now() + '#mode=' + m + (d ? '&diff=' + d : '') + (t ? '&trailer=' + trailer : '');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { location.href = url; return; }
    menu.classList.add('leave');
    scene.classList.add('fast');
    rig.classList.add('depart');
    var done = false;
    function next() { if (!done) { done = true; location.href = url; } }
    rig.addEventListener('transitionend', next, { once: true });
    setTimeout(next, 2200);                                  // 念のため
  }

  // トレーラー選択画面(シミュレーション用)。一覧から作る
  TRAILERS.filter(function (t) { return t.modes.indexOf('sim') >= 0; }).forEach(function (t) {
    var b = document.createElement('button');
    b.className = 'card'; b.setAttribute('data-trailer', t.id);
    b.innerHTML = '<span class="ico"></span><span><b></b><small></small></span><span class="go">›</span>';
    b.querySelector('b').textContent = t.name; b.querySelector('small').textContent = t.desc;
    b.addEventListener('click', function () { go('sim', null, t.id); });
    $('trailerPanel').appendChild(b);
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'), function (b) {
    b.addEventListener('click', function () {
      mode = b.getAttribute('data-mode');
      if (mode === 'tutsim') { show('ts'); return; }
      $('diffTitle').textContent = NAMES[mode] + ' の難易度';
      show('diff');
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-ts]'), function (b) {
    b.addEventListener('click', function () {
      if (b.getAttribute('data-ts') === 'tutorial') go('tutorial');   // チュートリアルは semi-6 固定・難易度なし
      else show('trailer');
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-diff]'), function (b) {
    b.addEventListener('click', function () { go(mode, b.getAttribute('data-diff'), pickTrailer(mode)); });   // タイムアタック・リアルはトレーラーをランダムに選ぶ
  });
  function back() { var b = document.querySelector('#' + cur + 'Panel [data-back]'); if (b) show(b.getAttribute('data-back')); }
  Array.prototype.forEach.call(document.querySelectorAll('[data-back]'), function (b) { b.addEventListener('click', back); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') back(); });

  // ゲームから「戻る」で帰ってきた時(ページが保存されていた場合)は元の状態に戻す
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    leaving = false;
    menu.classList.remove('leave'); scene.classList.remove('fast'); rig.classList.remove('depart');
    show('mode');
  });
})();
</script>
